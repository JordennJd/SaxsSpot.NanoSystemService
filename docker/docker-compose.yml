services:
  saxsspot-nanosystem-service:
    image: jordenndev/saxsspot
    build:
      context: ../SaxsSpot.NanoSystemService.Database
      dockerfile: Dockerfile
  db:
    image: postgres:latest
    container_name: db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: saxs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: s3user
      MINIO_ROOT_PASSWORD: s3secretkey
    command: server /data --console-address ":9001"
    
  db-init:
    image: postgres:latest
    container_name: db_initializer
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    entrypoint: >
      bash -c "until pg_isready -h db -U postgres; do sleep 1; done &&
               psql -h db -U postgres -d saxs -c 'CREATE SCHEMA IF NOT EXISTS saxs;'"
      
  liquibase:
    build:
      context: ../SaxsSpot.NanoSystemService.Database
      dockerfile: Dockerfile
    container_name: liquibase_migrator
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully